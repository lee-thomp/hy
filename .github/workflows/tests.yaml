name: Tests

on: [pull_request, push]

jobs:

  pytest:
    # Run the test suite.

    strategy:
      fail-fast: false
      matrix:
        name-prefix: ['']
        os: [ubuntu-24.04]
        python: ['3.12.5', '3.12.6']

    name: ${{ matrix.name-prefix }}${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm-256color
        # This is needed to avoid a terminfo-related crash when
        # testing PyPy.
      PYTHONPATH: .

    steps:
    - run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
          python-version: ${{ matrix.python }}
    - name: Install
      shell: bash
      run: |
        pip install .
        rm -r hy
          # We want to be sure we're testing the installed version,
          # instead of running from the source tree.
        pip install 'pytest >= 8.4.1'
    - name: Test
      shell: bash
      run: python -m pytest tests
